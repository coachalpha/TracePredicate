[tool.poetry]
name = "trace-predicate"
version = "0.1.0"
description = "Medical Device Regulatory Lineage Analysis System"
authors = ["Research Team"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
pandas = "^2.0.0"
numpy = "^1.24.0"
scipy = "^1.11.0"
networkx = "^3.1"
scikit-learn = "^1.3.0"
statsmodels = "^0.14.0"
transformers = "^4.30.0"
fastapi = "^0.100.0"
sqlalchemy = "^2.0.0"
psycopg2-binary = "^2.9.0"
requests = "^2.31.0"
beautifulsoup4 = "^4.12.0"
pypdf2 = "^3.0.0"
pdfplumber = "^0.10.0"
openai = "^1.0.0"
langchain = "^0.1.0"
streamlit = "^1.25.0"
python-dotenv = "^1.0.0"
aiohttp = "^3.8.0"
rich = "^13.0.0"
typer = "^0.9.0"
uvicorn = "^0.23.0"
torch = { version = "^2.0.0", optional = true }
lifelines = "^0.27.0"
pydantic-settings = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
black = "^23.7.0"
flake8 = "^6.0.0"
mypy = "^1.5.0"
jupyter = "^1.0.0"
ipykernel = "^6.25.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
trace-predicate = "trace_predicate.cli:app"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]